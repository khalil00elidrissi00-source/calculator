<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="calculator.svg">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="calculator">
      <div id="display-container">
        <input type="text" id="display" readonly value="0" />
      </div>
      <div id="keys">
        <button class="function top-func" onclick="clearDisplay()">AC</button>
        <button class="function top-func" onclick="toggleSign()">±</button>
        <button class="function top-func" onclick="deleteDigit()">⌫</button>
        <button class="operator" onclick="addToDisplay('÷')">÷</button>

        <button onclick="addToDisplay('7')">7</button>
        <button onclick="addToDisplay('8')">8</button>
        <button onclick="addToDisplay('9')">9</button>
        <button class="operator" onclick="addToDisplay('×')">×</button>

        <button onclick="addToDisplay('4')">4</button>
        <button onclick="addToDisplay('5')">5</button>
        <button onclick="addToDisplay('6')">6</button>
        <button class="operator" onclick="addToDisplay('-')">-</button>

        <button onclick="addToDisplay('1')">1</button>
        <button onclick="addToDisplay('2')">2</button>
        <button onclick="addToDisplay('3')">3</button>
        <button class="operator" onclick="addToDisplay('+')">+</button>

        <button onclick="addToDisplay('0')" class="span-2">0</button>
        <button onclick="addToDisplay('.')">.</button>
        <button class="operator" onclick="calculateResult()">=</button>
      </div>
    </div>
    2
    <script src="script.js"></script>
  </body>
</html>
